name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths:
      - 'docker-bake.hcl'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.extract.outputs.release }}
      app: ${{ steps.extract.outputs.app }}
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Extract RELEASE and APP from docker-bake.hcl
        id: extract
        run: |
          RELEASE=$(grep 'variable "RELEASE"' -A 2 docker-bake.hcl | grep 'default' | sed 's/.*"\(.*\)"/\1/')
          APP=$(grep 'variable "APP"' -A 2 docker-bake.hcl | grep 'default' | sed 's/.*"\(.*\)"/\1/')

          echo "release=${RELEASE}" >> $GITHUB_OUTPUT
          echo "app=${APP}" >> $GITHUB_OUTPUT

          echo "Current RELEASE: ${RELEASE}"
          echo "Current APP: ${APP}"

      - name: Check if RELEASE changed
        id: check
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Manual trigger - will build"
            exit 0
          fi

          PREV_RELEASE=$(git show HEAD^:docker-bake.hcl | grep -A 2 'variable "RELEASE"' | grep 'default' | sed 's/.*"\(.*\)"/\1/')
          CURR_RELEASE="${{ steps.extract.outputs.release }}"

          echo "Previous RELEASE: '${PREV_RELEASE}'"
          echo "Current RELEASE: '${CURR_RELEASE}'"

          if [ "${PREV_RELEASE}" != "${CURR_RELEASE}" ]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "RELEASE changed - will build"
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "No RELEASE changes detected - skipping build"
          fi

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Free up disk space
        run: |
          sudo swapoff -a
          sudo rm -rf /swapfile /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt clean
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all images (serially)
        env:
          REGISTRY: ghcr.io
          REGISTRY_USER: ${{ github.repository_owner }}
        run: |
          echo "Building cu130-py311..."
          docker buildx bake -f docker-bake.hcl --push cu130-py311
          docker buildx prune -af
          df -h

          echo "Building cu130-py312..."
          docker buildx bake -f docker-bake.hcl --push cu130-py312
          docker buildx prune -af
          df -h

          echo "Building cu130-py313..."
          docker buildx bake -f docker-bake.hcl --push cu130-py313
          docker buildx prune -af
          df -h

          echo "All images built successfully!"

      - name: Verify images were pushed
        run: |
          RELEASE="${{ needs.detect-changes.outputs.release }}"
          APP="${{ needs.detect-changes.outputs.app }}"

          sleep 10

          VARIANTS=("cu130-py311" "cu130-py312" "cu130-py313")
          for VARIANT in "${VARIANTS[@]}"; do
            IMAGE="ghcr.io/${{ github.repository_owner }}/${APP}:${VARIANT}-${RELEASE}"
            echo "Verifying image: $IMAGE"
            docker buildx imagetools inspect "$IMAGE" || echo "WARNING: Could not verify $IMAGE"
          done

      - name: Display summary
        run: |
          echo "## Docker Images Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** ${{ needs.detect-changes.outputs.release }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed to ghcr.io/${{ github.repository_owner }}/${{ needs.detect-changes.outputs.app }}" >> $GITHUB_STEP_SUMMARY
